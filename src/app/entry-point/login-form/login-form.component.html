<div class="container">
  <div class="content">

    <div class="row" style="margin-top: 25px;">
      <div class="col s12 m8 l5 offset-m2 offset-l3 z-depth-2 panell"
           style="border-radius: 12px; padding: 10px 25px;">

        <img class="responsive-img"
             src="assets/images/logo-qcloud.png"
             alt=""
             srcset=""
             style="background-color: #ffffff; margin-bottom: 25px;">

        <form (ngSubmit)="onSubmit()" #loginForm="ngForm" ngNativeValidate>

          <div class="input-field">
            <input type="text"
                   name="username"
                   [(ngModel)]="username"
                   id="username"
                   required>
            <label for="username">Username</label>
          </div>

          <div class="input-field">
            <input type="password"
                   id="password"
                   [(ngModel)]="password"
                   name="password"
                   required>

            <label for="password">Password</label>

            <span [ngClass]="{'helper-text': isBad}"
                  class="helper-text"
                  data-error="wrong"
                  data-success="right"
                  style="font-size: 15px;">
              {{serverOutput}}
            </span>
          </div>

          <button type="submit"
                  class="right waves-effect waves-light btn"
                  id="loginbtn"
                  [disabled]="!loginForm.form.valid">
            Login
          </button>

        </form>
      </div>
    </div>

    <div class="row" style="margin-top: 10px;">

      <div class="col s12 m6 offset-m3 l3 offset-l4">

        <div class="card-panel z-depth-1 center-align"
             style="padding: 6px; margin-bottom: 8px;">
          <a routerLink="/register"
             class="green-text text-darken-2"
             style="font-weight: 500; color: #7fcdbb !important;">
            Sign up
          </a>
        </div>

        <div class="card-panel z-depth-1 center-align"
             style="padding: 6px; margin-bottom: 8px;">
          <a href="https://demo.qcloud2.crg.eu"
             target="_blank"
             class="green-text text-darken-2"
             style="font-weight: 500; color: #7fcdbb !important;">
            Demo version
          </a>
        </div>

        <div class="card-panel z-depth-1 center-align"
             style="padding: 6px;">
          <a routerLink="/recovery"
             class="green-text text-darken-2"
             style="font-weight: 500; color: #7fcdbb !important;">
            Password recovery
          </a>
        </div>

      </div>

    </div>

    <div class="row" style="margin-top: 25px;">

      <div class="col s12 m10 offset-m1 l8 offset-l2 card-panel z-depth-1"
           *ngIf="generalStats"
           style="border-radius: 10px;">

        <a class="titleNumbers">
          QCloud statistics
        </a>

        <div class="row panellNumbers">

          <div class="col l4 s12 texte">
            <p>
              <a class="bignum">
                {{generalStats.totalFiles - difference}}
              </a>
              <br>
              <a class="underNumber">
                files
              </a>
            </p>
          </div>

          <div class="col l4 s12 texte">
            <p>
              <a class="bignum">
                {{generalStats.totalNodes}}
              </a>
              <br>
              <a class="underNumber">
                laboratories
              </a>
            </p>
          </div>

          <div class="col l4 s12 texte">
            <p>
              <a class="bignum">
                {{generalStats.totalLs}}
              </a>
              <br>
              <a class="underNumber">
                instruments
              </a>
            </p>
          </div>

        </div>
      </div>

    </div>

    <!--
    <div class="row">
      <div class="col s8 offset-s2 z-depth-1" id="panell">
        ...
      </div>
    </div>
    -->

  </div>
</div>

<footer class="page-footer footer"
        style="background-color: #f4f9f4; margin: 0; padding: 12px 0 0 0;">

  <div class="containerFooter">

    <div class="row">

      <div class="col l2 s12">
        <a href="https://www.crg.eu/">
          <img src="assets/images/logo_CRG.png"
               alt=""
               class="imagerino"
               style="max-height: 72px;">
        </a>
      </div>

      <div class="col l2 s12">
        <a href="https://www.upf.edu/">
          <img src="assets/images/upfLogo.png"
               alt=""
               class="imagerino"
               style="max-height: 72px;">
        </a>
      </div>

      <div class="col l2 s12">
        <a href="https://www.omicstech.es/">
          <img src="assets/images/logo_icts.svg"
               alt=""
               class="imagerino"
               style="max-height: 42px;">
        </a>
      </div>

      <div class="col l2 s12">
        <a href="https://epic-xs.eu/">
          <img src="assets/images/epic-xs_logo.png"
               alt=""
               class="imagerino"
               style="max-height: 72px;">
        </a>
      </div>

      <div class="col l2 s12">
        <a href="https://elixir-europe.org/">
          <img src="assets/images/elixir_logo.png"
               alt=""
               class="imagerino"
               style="max-height: 72px;">
        </a>
      </div>

      <div class="col l2 s12">
        <a href="https://proteored.org/">
          <img src="assets/images/proteoered_logo.png"
               alt=""
               class="imagerino"
               style="max-height: 42px;">
        </a>
      </div>

    </div>
  </div>

</footer>
