<ng-container *ngIf="type==='instrument' then instrument else user"></ng-container>
<ng-template #instrument>
  <div class="row">
    <div class="col s12 center" *ngIf="system!==null">
      <h4>{{system.name}}</h4>
    </div>
  </div>
  <div class="row">
    <div class="col s12 m12 l12 xl12">
      <app-auto-plot [labSystemStatus]="labSystemStatusFromUrl"></app-auto-plot>
    </div>
  </div>
  <div class="row">
    <div class="col s12 m12 l12 xl12">
      <ul class="tabs tabs-fixed-width" id="chartstabs">
        <li class="tab" *ngFor="let view of views">
          <a href="#tab{{view.id}}" (click)="loadTab(view)" class="text">{{view.name}}</a>
        </li>
        <div class="indicator purple accent-1" style="z-index:999"></div>
      </ul>
    </div>
  </div>
  <div class="row" *ngIf="hasPipelineError">
    <div class="col s12 m12 l12 xl12">
      <div class="pipeline-error-banner">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M12 3.5 L21.5 20 H2.5 Z" stroke="#c8860d" stroke-width="1.6" stroke-linejoin="round" fill="none"/>
          <line x1="12" y1="9.5" x2="12" y2="14.5" stroke="#c8860d" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="12" cy="17.3" r="1" fill="#c8860d"/>
        </svg>
        <span class="msg"><strong>A file failed processing</strong> &mdash; view in Pipeline Status</span>
        <a class="action" [routerLink]="['/application']" [queryParams]="{labSystemApiKey: system.apiKey}">View details &rarr;</a>
      </div>
    </div>
  </div>
  <div id="tab{{view.id}}" class="col s12 m12 l12 xl12" *ngFor="let view of views">
    <div *ngIf="viewLoaded[view.id] | async">
      <!-- <app-file-information [sampleTypeCategory]="view.sampleTypeCategory"></app-file-information> -->
      <app-isotopologue-information [sampleTypeCategory]="view.sampleTypeCategory"
        *ngIf="view.sampleTypeCategory.sampleTypeComplexity=='HIGHWITHISOTOPOLOGUES'"></app-isotopologue-information>
      <div class="row valign-wrapper" *ngFor="let row of displays['a'+view.id].charts">
        <ng-container *ngIf="row.length==1 then single else double"></ng-container>
        <ng-template #single>
          <div class="col s12 m12 l12 xl12" *ngFor="let charts of row">
            <app-plot [chart]="charts.chart" [system]="system" [shownames]="false" [big]="true"></app-plot>
          </div>
        </ng-template>
        <ng-template #double>
          <div class="col s12 m6 l6 xl6" *ngFor="let charts of row">
            <app-plot [chart]="charts.chart" [system]="system" [shownames]="false" [big]="false"></app-plot>
          </div>
        </ng-template>
      </div>
    </div>
  </div>
</ng-template>
<ng-template #user>
  <!-- <app-file-information></app-file-information> -->
  <div class="row valign-wrapper" *ngFor="let row of display.charts">
    <ng-container *ngIf="row.length==1 then single else double"></ng-container>
    <ng-template #single>
      <div class="col s12 m12 l12 xl12" *ngFor="let charts of row">
        <app-plot [chart]="charts.chart" [system]="charts.labSystem" [shownames]="true" [big]="true"></app-plot>
      </div>
    </ng-template>
    <ng-template #double>
      <div class="col s12 m6 l6 xl6" *ngFor="let charts of row">
        <app-plot [chart]="charts.chart" [system]="charts.labSystem" [shownames]="true" [big]="false"></app-plot>
      </div>
    </ng-template>
  </div>
</ng-template>
